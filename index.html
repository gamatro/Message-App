<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

   <link rel="icon" type="image/png" href="favicon de Message App.png">
   
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Message App</title>
<style>
:root{
  --page:#e4e8f0; --panel:#ffffff; --side:#f7f8fb; --ink:#1c2230; --muted:#6b7280; --line:#e6e9f0;
  --accent:#2563d9; --accent-ink:#ffffff; --sel:#e6edff; --sel-ink:#1d4fb8;
  --bubble:#dde8ff; --other:#eef0f4; --btn:#f1f2f6; --danger:#a8323e; --input:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0c0f16; --panel:#161b26; --side:#121722; --ink:#e7eaf2; --muted:#98a0b3; --line:#262d3d;
    --accent:#4c86f0; --accent-ink:#0a1020; --sel:#1f2d4d; --sel-ink:#9dbbff;
    --bubble:#22345c; --other:#232a3a; --btn:#232a3a; --danger:#f08a95; --input:#1b2130;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0c0f16; --panel:#161b26; --side:#121722; --ink:#e7eaf2; --muted:#98a0b3; --line:#262d3d;
  --accent:#4c86f0; --accent-ink:#0a1020; --sel:#1f2d4d; --sel-ink:#9dbbff;
  --bubble:#22345c; --other:#232a3a; --btn:#232a3a; --danger:#f08a95; --input:#1b2130;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;position:fixed;inset:0;overflow:hidden;background:var(--page);color:var(--ink);
  padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));
  font:16px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 16px;background:var(--btn)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink)}
.danger{color:var(--danger)}
input[type=text],input[type=email],input[type=password],input[type=tel]{font:inherit;color:var(--ink);background:var(--input);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
input::placeholder{color:var(--muted)}
.err{color:var(--danger);margin:0;min-height:1.2em;font-size:.9rem}
.card{background:var(--panel);border-radius:20px;padding:26px;width:min(400px,92vw);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(20,30,60,.2)}
.card h1,.card h3{margin:0}
.link2{background:transparent;color:var(--accent)}
#auth{position:fixed;inset:0;display:grid;place-items:center;background:var(--page)}
.app{display:grid;grid-template-columns:390px 1fr;grid-template-rows:minmax(0,1fr);height:100%;background:var(--panel);
  border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(20,30,60,.18)}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside header{padding:20px 18px 12px;display:flex;align-items:center;gap:8px}
aside h1{font-size:1.45rem;margin:0;font-weight:700;flex:1}
#mynum{padding:0 20px 12px;color:var(--muted);font-size:.85rem}
.dots{background:transparent;padding:6px 10px;font-size:1.3rem;line-height:1}
.dots:hover{background:var(--btn)}
#list{overflow-y:auto;flex:1;padding:0 12px 12px}
.chat{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;cursor:pointer;margin-bottom:4px}
.chat span:not(.badge){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat:hover{background:var(--sel)}
.chat.active{background:var(--sel);color:var(--sel-ink);font-weight:700}
.badge{min-width:22px;text-align:center;font-size:.8rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:11px;padding:0 7px}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
main header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
main h2{font-size:1.25rem;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{display:none;padding:6px 10px}
.tw{flex:1;min-width:0}
.msg.bare{background:transparent;padding:2px 4px}
.stk{font-size:72px;line-height:1.1}
.gifimg{max-width:220px;max-height:220px;border-radius:14px;display:block}
#panel{flex-shrink:0;height:250px;border-top:1px solid var(--line);background:var(--side);display:flex;flex-direction:column}
.ptabs{display:flex;gap:6px;padding:8px;align-items:center}
.ptabs button.on,.kr button.on{background:var(--accent);color:var(--accent-ink)}
.pg{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;padding:8px}
.pg button{font-size:1.6rem;background:transparent;padding:4px}
.pg.st{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}.pg.st button{font-size:3rem}
.pgif{padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hint{margin:0;color:var(--muted);font-size:.85rem}
#kb{flex-shrink:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--side);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.kr{display:flex;gap:5px;justify-content:center}
.kr button{flex:1;max-width:46px;padding:12px 0;border-radius:8px;background:var(--panel);font-size:1.1rem}
.kr button.wide{max-width:none;flex:1.6}
.kr button.space{max-width:none;flex:5}
#sub{font-size:.8rem;color:var(--accent);min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;overflow-y:auto;padding:24px 22px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;color:var(--muted);text-align:center}
.msg{max-width:min(78%,680px);padding:10px 16px 6px}
.msg.mine{align-self:flex-end;background:var(--bubble);border-radius:20px 20px 4px 20px}
.msg.theirs{align-self:flex-start;background:var(--other);border-radius:20px 20px 20px 4px}
.msg p{margin:0;font-size:1.1rem;overflow-wrap:anywhere;white-space:pre-wrap}
.who{font-size:.8rem;color:var(--accent)}
.meta{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:2px;font-size:.78rem;color:var(--muted)}
.dot{width:11px;height:11px;border-radius:50%;background:#9aa1ad;display:inline-block}
.dot.seen{background:var(--accent)}
.del{background:transparent;border-radius:6px;padding:0 2px;font-size:.78rem;color:var(--danger)}
.aud{display:flex;align-items:center;gap:10px;min-width:min(270px,62vw)}
.play{width:38px;height:38px;border-radius:50%;padding:0;background:var(--accent);color:var(--accent-ink);flex:none}
.track{position:relative;flex:1;height:34px;display:flex;align-items:center;gap:2px;cursor:pointer}
.bar{flex:1;min-width:2px;background:var(--muted);opacity:.45;border-radius:2px}
.bar.on{background:var(--accent);opacity:1}
.knob{position:absolute;top:50%;left:0;width:13px;height:13px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--panel)}
#f{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
#rt{flex:1;color:var(--danger);font-weight:700;padding:0 8px}
.round{width:44px;height:44px;padding:0;border-radius:50%;font-size:1.1rem}
#menu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:210px;box-shadow:0 8px 24px rgba(20,30,60,.25)}
#menu button{display:block;width:100%;text-align:left;background:transparent;border-radius:8px}
#menu button:hover:not(:disabled){background:var(--btn)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,15,30,.5);display:grid;place-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;justify-content:flex-end}
.photo{display:flex;align-items:center;gap:12px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.filebtn{position:relative;cursor:pointer;background:var(--btn);border-radius:12px;padding:9px 16px}
.filebtn:focus-within{outline:2px solid var(--accent)}
.picks{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 8px;border-radius:10px}
.pick:hover{background:var(--btn)}
.pick input{width:20px;height:20px;flex:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;z-index:50}
@media (max-width:760px){
  body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  .app{grid-template-columns:1fr;border-radius:0;box-shadow:none}
  .app.in-chat aside{display:none}
  .app:not(.in-chat) main{display:none}
  #back{display:inline-block}
  #msgs{padding:16px 12px}
  .msg{max-width:92%}
}
</style>
</head>
<body>
<div id="auth"></div>
<div class="app" id="app" hidden>
  <aside>
    <header><h1>Message App</h1><button class="primary" id="new">+ New</button><button class="dots" id="sdots" aria-label="Options">⋮</button></header>

</div>
<div id="menu" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

  if(x==="class")e.className=v;else if(x==="text")e.textContent=v;else if(x.startsWith("on"))e[x]=v;else e.setAttribute(x,v);}
  k.flat(2).forEach(c=>{if(c!=null&&c!==false)e.append(c);});return e;}
const rnd=n=>Array.from({length:n},()=>Math.floor(Math.random()*10)).join("");
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const hm=t=>new Date(t).toLocaleTimeString(lang,{hour:"numeric",minute:"2-digit"});
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
let db=null,me=null,users={},contacts={},chats=[],msgs=[],cid=null,unsubs=[],marking=new Set(),lastKey="",cp=null,rec=null;

const fail=()=>toast(T("Something went wrong. Please try again."));
/* local storage database (no external service) */
const KEYDB="msgapp-db-v1";let mem={};const subs=new Set();
const rd=()=>{try{const t=localStorage.getItem(KEYDB);return t?JSON.parse(t):mem;}catch(e){return mem;}};

const notify=()=>subs.forEach(f=>f());

const local={
  doc(p){return{id:p.split("/")[1],
    get:async()=>{const d=rd()[p];return{exists:!!d,data:()=>d};},
    set:async d=>mut(o=>{o[p]=d;}),
    update:async d=>mut(o=>{o[p]=Object.assign({},o[p],d);}),

    const mk=f=>({where:(k,op,v)=>mk(x=>f(x)&&(op==="=="?x[k]===v:(x[k]||[]).includes(v))),

/* optional shared server (Firebase Realtime Database URL) so people on different devices can chat */

  const U=p=>base.replace(/\/$/,"")+"/"+p+".json",pokes=new Set(),poke=()=>setTimeout(()=>pokes.forEach(f=>f()),150);

    doc(p){return{id:p.split("/")[1],

/* online status: only shown when the person has THIS chat open */
let pres={};
function onPres(q){const now=Date.now();q.docs.forEach(d=>{const v=d.data(),p=pres[d.id];if(!p||p.t!==v.t)pres[d.id]={t:v.t,c:v.c,at:now};});paintStatus();}
const isIn=ph=>{const v=pres[ph];return !!v&&v.t>0&&Date.now()-v.at<15000&&v.c===cid;};

    else if(c.type==="group"){const ns=c.members.filter(p=>p!==me.phone&&isIn(p)).map(nameOf);if(ns.length)t=T("Online: ")+ns.join(", ");}}

function beat(){if(me&&db&&document.visibilityState==="visible")db.doc("presence/"+me.phone).set({t:Date.now(),c:cid||""}).catch(()=>{});paintStatus();}

/* render */

    const mn=m.from===me.phone,sender=mn?me:(users[m.from]||{name:nameOf(m.from)}),el=h("div",{class:"msg "+(mn?"mine":"theirs"),"data-id":m.id});
    if(c.type==="group"&&!mn)el.append(h("b",{class:"who",text:nameOf(m.from)}));

}
